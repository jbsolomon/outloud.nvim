[package]
name = "outloud"
description = "CLI daemon for outloud.nvim — voice-driven coding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["whisper"]
openai = ["dep:reqwest", "dep:base64", "dep:hound"]
whisper = ["dep:reqwest", "dep:hound"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
streamsafe.workspace = true
cpal = "0.18"

# http backend (llama-server, vLLM, etc.)
reqwest = { version = "0.13", features = ["json", "multipart", "blocking"], optional = true }
base64 = { version = "0.23", optional = true }
hound = { version = "3.5", optional = true }
